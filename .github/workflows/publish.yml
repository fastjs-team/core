name: Publish Package

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Set Git Config
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Checkout Branch
        run: git checkout main

      - name: Bump package version
        continue-on-error: true
        run: |
          pnpm -r version --no-git-tag-version --no-git-checks ${{ github.event.release.tag_name }}
          git add **/package.json
          git commit -m "build: bump package version to ${{ github.event.release.tag_name }}"

      - name: Build Package
        run: pnpm run prod

      - name: Push changes
        # Pinned to a specific tag - using `master` lets an upstream
        # compromise execute arbitrary code with our PUSH_TOKEN.
        uses: ad-m/github-push-action@d91a481090679876dfc4178fef17f286781251df # v0.8.0
        with:
          github_token: ${{ secrets.PUSH_TOKEN }}
          branch: main

      - name: Publish Package
        run: |
          cd packages/core
          npm publish --access public --tag latest
